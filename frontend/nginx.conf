server {
    listen 3000;
    server_name localhost;

    # Root directory where the built React (Vite) static files live
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- React Router / SPA fallback ---
    # Any route that isn't a real file (e.g. /dashboard, /profile) should
    # fall back to index.html so client-side routing can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Reverse proxy to greeting-service ---
    # This solves the "browser can't resolve internal Docker/K8s service names" problem:
    # the BROWSER calls http://localhost:3000/api/..., which hits THIS Nginx container.
    # Nginx (running inside the Docker/K8s network) then forwards the request to
    # greeting-service using its internal service name — which Nginx CAN resolve,
    # because Nginx itself is on the internal network, unlike the user's browser.
    resolver 127.0.0.11 valid=10s;   # 127.0.0.11 = Docker's internal embedded DNS server

    location /api/ {
        set $upstream_greeting http://greeting-service:8080;
        proxy_pass $upstream_greeting/;
        ...
    }
    location /api/ {
        proxy_pass http://greeting-service:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Cache static assets aggressively (JS/CSS have hashed filenames from Vite build)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html — always fetch the latest shell
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
