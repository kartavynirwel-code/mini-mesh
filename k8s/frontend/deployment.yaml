apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: mini-mesh-frontend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: GREETING_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: mini-mesh-secrets
              key: GREETING_SERVICE_URL
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
