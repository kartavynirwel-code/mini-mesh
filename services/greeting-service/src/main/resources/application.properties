# --- Server ---
server.port=8080

# --- Downstream service location -------------------------------------
# Points at user-service's ClusterIP Service DNS name in-cluster, e.g.:
#   http://user-service.mini-mesh.svc.cluster.local:8080
# Overridden via the USER_SERVICE_URL env var (set from a ConfigMap in k8s).
user.service.url=${USER_SERVICE_URL:http://localhost:8081}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# --- Logging ---
logging.level.com.minimesh.greetingservice=INFO

management.endpoints.web.exposure.include=health,info,prometheus
