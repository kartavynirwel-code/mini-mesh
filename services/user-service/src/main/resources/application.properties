# --- Server ---
server.port=8081

# --- Downstream service location -------------------------------------
# NEVER hardcode this. In k8s this is injected via a ConfigMap +
# env var of the same name, pointing at the notification-service
# ClusterIP Service's DNS name, e.g.:
#   http://notification-service.mini-mesh.svc.cluster.local:8000
# The ${NOTIFICATION_SERVICE_URL:default} syntax means: use the env var
# if set, otherwise fall back to this default (handy for running the
# jar locally with `docker run` for a quick smoke test before k8s exists).
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8000}

# --- Actuator ---
# Expose only what's needed. Exposing everything (env, beans, etc.) over
# an unauthenticated endpoint is a real interview red flag to avoid.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# --- Logging ---
logging.level.com.minimesh.userservice=INFO

management.endpoints.web.exposure.include=health,info,prometheus
